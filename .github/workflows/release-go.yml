name: Publish GateStream-Lite binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Detect app version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          read_version() {
            sed -nE 's/^const version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p'
          }
          version=$(read_version < config.go)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable X.Y.Z version in config.go.' >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == push && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE"
            fi
            if [[ -n "$(git ls-tree "$BEFORE" -- config.go)" ]]; then
              previous=$(git show "$BEFORE:config.go" | read_version)
              if [[ "$version" == "$previous" ]]; then
                printf 'Version %s did not change. Skipping release.\n' "$version"
                exit 0
              fi
            fi
          fi
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        if: steps.version.outputs.tag != ''
        with:
          go-version-file: go.mod
      - name: Run Go tests
        if: steps.version.outputs.tag != ''
        run: go test ./...
      - name: Build and verify release binaries
        if: steps.version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          CGO_ENABLED: '0'
          GOARCH: amd64
        run: |
          mkdir -p bin
          GOOS=linux go build -buildvcs=false -trimpath -ldflags='-s -w' -o bin/gatestream-linux-amd64 .
          test "$(bin/gatestream-linux-amd64 --version)" = "GateStream ${RELEASE_TAG#v}"
          GOOS=freebsd go build -buildvcs=false -trimpath -ldflags='-s -w' -o bin/gatestream-freebsd-amd64 .
          (cd bin && sha256sum gatestream-linux-amd64 gatestream-freebsd-amd64 > SHA256SUMS)
          /bin/sh scripts/check-release.sh
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.tag != ''
        with:
          name: gatestream-lite-release-binaries
          compression-level: 0
          if-no-files-found: error
          path: |
            bin/gatestream-linux-amd64
            bin/gatestream-freebsd-amd64
            bin/SHA256SUMS

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gatestream-lite-release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gatestream-lite-release-binaries
          path: dist
      - name: Publish a new release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq \
            ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          if grep -Fxq false <<< "$releases"; then
            printf 'Release %s already exists. Leaving it untouched.\n' "$RELEASE_TAG"
            exit 0
          fi
          if [[ -n "$releases" ]]; then
            printf 'Draft %s already exists. Review it before retrying.\n' "$RELEASE_TAG" >&2
            exit 1
          fi

          ref="refs/tags/$RELEASE_TAG"
          tag_object=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq \
            ".[] | select(.ref == \"$ref\") | [.object.type, .object.sha] | @tsv")
          if [[ -n "$tag_object" ]]; then
            read -r type commit <<< "$tag_object"
            while [[ "$type" == tag ]]; do
              object=$(gh api "repos/$GH_REPO/git/tags/$commit" --jq '[.object.type, .object.sha] | @tsv')
              read -r type commit <<< "$object"
            done
            if [[ "$type" != commit || "$commit" != "$BUILD_COMMIT" ]]; then
              printf 'Tag %s points somewhere other than the built commit.\n' "$RELEASE_TAG" >&2
              exit 1
            fi
          fi

          sha256sum -c SHA256SUMS
          gh release create "$RELEASE_TAG" --target "$BUILD_COMMIT" --generate-notes --draft \
            --title "GateStream-Lite $RELEASE_TAG" \
            gatestream-freebsd-amd64 gatestream-linux-amd64 SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false
